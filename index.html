<!DOCTYPE html>
<html>
<head>
    <title>Flask API Connector</title>
    <script src="https://connectors.tableau.com/libs/tableauwdc-2.6.0.js"></script>
</head>
<body>
    <h1>Location Data Connector</h1>
    <button id="loadButton">Load Data</button>

    <script>
        const apiURL = "https://flask-api.redforest-b880aba9.eastus.azurecontainerapps.io/location";
        const apiKey = "3c4e642d15428eb4064c935f3450bd2d2acb27f6c5ebe341fefc76be058a5654";

        document.getElementById("loadButton").addEventListener("click", function () {
            const myConnector = tableau.makeConnector();

            myConnector.getSchema = function (schemaCallback) {
                const cols = [
                    { id: "ADDRESS1", dataType: tableau.dataTypeEnum.string },
                    { id: "ADDRESS2", dataType: tableau.dataTypeEnum.string },
                    { id: "CITY", dataType: tableau.dataTypeEnum.string },
                    { id: "COUNTY", dataType: tableau.dataTypeEnum.string },
                    { id: "CUSTOMER_ID", dataType: tableau.dataTypeEnum.string },
                    { id: "DISTRICT", dataType: tableau.dataTypeEnum.string },
                    { id: "REGION", dataType: tableau.dataTypeEnum.string },
                    { id: "STATE", dataType: tableau.dataTypeEnum.string },
                    { id: "STORE_ID", dataType: tableau.dataTypeEnum.string },
                    { id: "ZIP", dataType: tableau.dataTypeEnum.string },
                    { id: "ZONE", dataType: tableau.dataTypeEnum.string }
                ];

                const tableSchema = {
                    id: "locationData",
                    alias: "Location Records",
                    columns: cols
                };

                schemaCallback([tableSchema]);
            };

            myConnector.getData = function (table, doneCallback) {
                console.time("FetchTime");
                tableau.reportProgress("Fetching data...");

                fetch(apiURL, {
                    method: "GET",
                    headers: {
                        "x-api-key": apiKey
                    }
                })
                    .then(response => response.json())
                    .then(data => {
                        const chunkSize = 1000;
                        let index = 0;

                        function loadChunk() {
                            if (index >= data.length) {
                                tableau.reportProgress("All data loaded.");
                                console.timeEnd("FetchTime");
                                doneCallback();
                                return;
                            }

                            const chunk = data.slice(index, index + chunkSize).map(item => ({
                                ADDRESS1: item.ADDRESS1,
                                ADDRESS2: item.ADDRESS2,
                                CITY: item.CITY,
                                COUNTY: item.COUNTY,
                                CUSTOMER_ID: item.CUSTOMER_ID,
                                DISTRICT: item.DISTRICT,
                                REGION: item.REGION,
                                STATE: item.STATE,
                                STORE_ID: item.STORE_ID,
                                ZIP: item.ZIP,
                                ZONE: item.ZONE
                            }));

                            table.appendRows(chunk);
                            index += chunkSize;

                            tableau.reportProgress(`Loaded ${index} of ${data.length} rows...`);
                            setTimeout(loadChunk, 0); // Yield control to browser
                        }

                        loadChunk();
                    })
                    .catch(error => {
                        console.error("Fetch error:", error);
                        tableau.abortWithError("Failed to fetch data: " + error.message);
                    });
            };

            tableau.registerConnector(myConnector);
            tableau.connectionName = "Flask API - Location Data";
            tableau.submit();
        });
    </script>
</body>
</html>
