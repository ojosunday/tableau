<!DOCTYPE html>
<html>
<head>
    <title>Simple WDC</title>
    <script src="https://connectors.tableau.com/libs/tableauwdc-2.3.latest.js"></script>
</head>
<body>
    <h1>My REST API Connector</h1>
    <button onclick="submit()">Load Data</button>

    <script>
        let myConnector = tableau.makeConnector();

        myConnector.getSchema = function (schemaCallback) {
            const cols = [ 
                { id: "ADDRESS1", dataType: tableau.dataTypeEnum.string },
				{ id: "ADDRESS2", dataType: tableau.dataTypeEnum.string },
				{ id: "CITY", dataType: tableau.dataTypeEnum.string },
				{ id: "COUNTY", dataType: tableau.dataTypeEnum.string },
				{ id: "CUSTOMER_ID", dataType: tableau.dataTypeEnum.string },
				{ id: "DISTRICT", dataType: tableau.dataTypeEnum.string },
				{ id: "REGION", dataType: tableau.dataTypeEnum.string },
				{ id: "STATE", dataType: tableau.dataTypeEnum.string },
				{ id: "STORE_ID", dataType: tableau.dataTypeEnum.string },
				{ id: "ZIP", dataType: tableau.dataTypeEnum.string },
                { id: "ZONE", dataType: tableau.dataTypeEnum.string }
                // Add more columns here based on your API
            ];
            let tableSchema = {
                id: "myAPIData",
                alias: "Customer Data",
                columns: cols
            };
            schemaCallback([tableSchema]);
        };

        myConnector.getData = function (table, doneCallback) {
            fetch("https://flask-api.redforest-b880aba9.eastus.azurecontainerapps.io/item", {
                headers: { "x-api-key": "3c4e642d15428eb4064c935f3450bd2d2acb27f6c5ebe341fefc76be058a5654" }
            })
            .then(response => response.json())
            .then(data => {
                // Convert your JSON to row array
                let rows = data.map(item => ({ 
                    ADDRESS1: item.ADDRESS1,
					ADDRESS2: item.ADDRESS2,
					CITY: item.CITY,
					COUNTY: item.COUNTY,
					CUSTOMER_ID: item.CUSTOMER_ID,
					DISTRICT: item.DISTRICT,
					REGION: item.REGION,
					STATE: item.STATE,
					STORE_ID: item.STORE_ID,
					ZIP: item.ZIP,
                    ZONE: item.ZONE
                    // Add other fields as needed
                }));
                table.appendRows(rows);
                doneCallback();
            });
        };

        tableau.registerConnector(myConnector);

        function submit() {
            tableau.connectionName = "My API Connection";
            tableau.submit();
        }
    </script>
</body>
</html>
